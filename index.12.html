<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F6;--surface:#FFFFFF;--surface2:#F5F7FB;--line:#E1E7F0;--text:#0F172A;--muted:#55657D;--faint:#8593A8;
  --navy:#0D2143;--navy2:#15305B;--gold:#E5BA73;--goldtx:#9A6B10;
  --ok:#047857;--wip:#B45309;--bad:#DC2626;--idle:#64748B;
  --ok-bg:#ECFDF5;--wip-bg:#FFFBEB;--bad-bg:#FEF2F2;--idle-bg:#F1F5F9;--info-bg:#EFF6FF;--info:#1D4ED8;
  --c-ok:#059669;--c-wip:#D97706;--c-bad:#E11D48;--c-idle:#94A3B8;
  --focus:#2563EB;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070D19;--surface:#0E1A2E;--surface2:#12233A;--line:#1E3350;--text:#E6ECF5;--muted:#9CABC1;--faint:#71829B;
    --navy:#0A1830;--navy2:#15305B;--goldtx:#E5BA73;
    --ok:#34D399;--wip:#FBBF24;--bad:#F87171;--idle:#94A3B8;
    --ok-bg:#0B2A22;--wip-bg:#2B2210;--bad-bg:#2E1517;--idle-bg:#16263C;--info-bg:#10264A;--info:#93C5FD;
    --c-ok:#10B981;--c-wip:#F59E0B;--c-bad:#F43F5E;--c-idle:#64748B;--focus:#60A5FA;
  }
}
:root[data-theme="dark"]{
  --bg:#070D19;--surface:#0E1A2E;--surface2:#12233A;--line:#1E3350;--text:#E6ECF5;--muted:#9CABC1;--faint:#71829B;
  --navy:#0A1830;--navy2:#15305B;--goldtx:#E5BA73;
  --ok:#34D399;--wip:#FBBF24;--bad:#F87171;--idle:#94A3B8;
  --ok-bg:#0B2A22;--wip-bg:#2B2210;--bad-bg:#2E1517;--idle-bg:#16263C;--info-bg:#10264A;--info:#93C5FD;
  --c-ok:#10B981;--c-wip:#F59E0B;--c-bad:#F43F5E;--c-idle:#64748B;--focus:#60A5FA;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;display:flex;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.25}
/* sidebar */
.side{width:250px;flex-shrink:0;background:linear-gradient(180deg,#040A15,#0A1931 60%,#0D2143);color:#CBD5E1;display:flex;flex-direction:column;z-index:40;transition:transform .25s}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:40px;height:40px;border-radius:11px;background:var(--gold);display:grid;place-items:center;color:#0A1931;flex-shrink:0}
.brand b{display:block;font-size:14px;color:#fff;font-weight:800}
.brand span{font-size:11.5px;color:#8FA0B8}
.side nav{flex:1;overflow-y:auto;padding:10px}
.ngrp{font-size:11.5px;font-weight:600;color:#7C8DA6;padding:14px 10px 5px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;margin-bottom:2px;border:0;border-radius:10px;background:none;text-align:left;font-size:13px;font-weight:600;color:#A9B7CB;cursor:pointer}
.nav svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-current="page"]{background:rgba(229,186,115,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav[aria-current="page"] svg{color:var(--gold)}
.nb{margin-left:auto;min-width:22px;text-align:center;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:#F87171;color:#2A0A0A}
.sfoot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#8FA0B8;line-height:1.5}
.sfoot b{display:block;color:#E2E8F0;font-size:12.5px}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:39}
#scrim.on{display:block}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
#menu{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;place-items:center}
#menu svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.top h1{font-size:17px;font-weight:800}
.top p{font-size:12px;color:var(--muted)}
.asof{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;white-space:nowrap}
#view{flex:1;overflow-y:auto;padding:22px 24px 32px}
#view>*+*{margin-top:18px}
/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{font-size:15px;font-weight:800;margin-bottom:2px}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g32{display:grid;grid-template-columns:3fr 2fr;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-wip{background:var(--wip-bg);color:var(--wip)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-idle{background:var(--idle-bg);color:var(--idle)}
.pri{display:inline-block;min-width:32px;text-align:center;padding:1px 8px;border-radius:7px;font-size:11.5px;font-weight:800;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pri.p0{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pri.p1{background:var(--info-bg);color:var(--info);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text)}
.btn:hover{background:var(--surface2)}
.link{border:0;background:none;color:var(--info);font-weight:700;font-size:12.5px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
/* segmented bars */
.seg{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--idle-bg)}
.seg i{display:block;min-width:3px}
.s-ok{background:var(--c-ok)}.s-wip{background:var(--c-wip)}.s-bad{background:var(--c-bad)}.s-idle{background:var(--c-idle)}
/* hero */
.hero{background:linear-gradient(135deg,#040A15,var(--navy) 50%,var(--navy2));color:#fff;border-radius:18px;padding:26px 28px}
.hero{--c-ok:#34D399;--c-wip:#FBBF24;--c-bad:#F87171;--c-idle:#94A3B8}
.hero .seg{height:16px;background:rgba(255,255,255,.1)}
.hero-top{display:flex;flex-wrap:wrap;gap:22px 36px;align-items:flex-end;margin-bottom:22px}
.big{font-size:68px;font-weight:800;line-height:.95;color:var(--gold);letter-spacing:-.03em}
.big small{font-size:26px;letter-spacing:0}
.hero-sub{font-size:14px;font-weight:700;margin-top:6px}
.hero p{font-size:13.5px;line-height:1.7;color:#B7C3D6;max-width:60ch;flex:1;min-width:240px}
.hero p b{color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:14px;font-size:12.5px;color:#B7C3D6}
.legend b{font-size:18px;color:#fff;margin-right:5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* attention */
.attn{list-style:none}
.attn li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.attn li:last-child{border-bottom:0;padding-bottom:0}
.attn li:first-child{padding-top:0}
.attn .n{flex-shrink:0;min-width:46px;text-align:center;font-size:18px;font-weight:800;padding:3px 0;border-radius:9px}
.attn .n.bad{background:var(--bad-bg);color:var(--bad)}.attn .n.wip{background:var(--wip-bg);color:var(--wip)}.attn .n.info{background:var(--info-bg);color:var(--info)}
.attn b{display:block;font-size:13px}
.attn span.d{font-size:12.5px;color:var(--muted)}
/* bars list */
.bl{list-style:none}
.bl li{padding:9px 0;border-bottom:1px solid var(--line)}
.bl li:last-child{border-bottom:0}
.bl .h{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.bl .h b{font-weight:700}
.bl .h span{color:var(--muted);white-space:nowrap;font-size:12.5px}
.chart{position:relative}
/* list view */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools .cnt{font-weight:800;font-size:15px;margin-right:4px}
.fi{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:500;min-width:0}
input.fi{min-width:220px;flex:1;max-width:340px}
.tw{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;padding:10px 14px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.t-title{min-width:240px;max-width:360px;font-weight:600}
.t-title .nt{font-weight:500;color:var(--muted);font-style:italic}
.t-title small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.rn{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.warn{color:var(--wip);font-weight:700}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px;font-size:14px}
/* projects */
.proj h2{font-size:16px}
.subs{list-style:none;margin-top:14px}
.subs li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.subs .nm{font-weight:600;font-size:13px}
.subs .dt{font-size:12px;color:var(--muted)}
.subs details{grid-column:1/-1;margin-top:4px;background:var(--wip-bg);border-radius:10px;padding:9px 12px;font-size:12.5px}
.subs summary{cursor:pointer;font-weight:700;color:var(--wip)}
.subs dl{margin-top:8px;display:grid;gap:6px}
.subs dt{font-weight:700;font-size:12px;color:var(--muted)}
.subs dd{margin:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
/* quality */
.issue{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:13px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}
.issue .k{grid-row:span 2;min-width:52px;text-align:center;font-size:18px;font-weight:800;padding:4px 0;border-radius:9px;height:fit-content}
.issue b{font-size:13px}
.issue span.d{font-size:12.5px;color:var(--muted)}
.issue .fix{font-size:12.5px;margin-top:2px}
.issue .fix em{font-style:normal;font-weight:700;color:var(--goldtx)}
@media (max-width:1023px){
  .side{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);padding-top:env(safe-area-inset-top,0px)}
  .side.on{transform:none}
  #menu{display:grid}
  .top{padding:10px 16px}
  #view{padding:16px 16px 28px}
  .asof{display:none}
}
@media (max-width:820px){
  .g2,.g32,.pgrid{grid-template-columns:1fr}
  .big{font-size:54px}
  .hero{padding:22px 20px}
  .tw{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    ['wip',doneNoEnd+noStart,'Tanggal mulai atau selesai kosong',`${doneNoEnd} tugas Selesai tanpa tanggal selesai dan ${noStart} tugas tanpa tanggal mulai. SLA untuk baris ini tidak bisa dihitung, jadi tidak masuk rata-rata.`,'Isi tanggal yang kosong.'],
    ['wip',overdue.length,'Tugas berjalan lewat tanggal akhir',`${overdue.length} tugas berstatus In progress dengan tanggal akhir sebelum ${fd(D.today)}.`,'Perbarui status atau tanggal akhirnya.'],
    ['info',docC.noend||0,'Dokumen tanpa tanggal berakhir',`${docC.noend||0} dari ${DOC.length} dokumen belum punya End date${docBad?`, dan ${docBad} dokumen punya End date lebih awal dari Start date`:''}.`,'Isi tanggal berakhir dan periksa tanggal yang terbalik.']
  ];
  const done=[
    ['Baris terisi',`Main Tracker punya 1.014 baris berformat, tetapi hanya ${N} yang berisi data (baris 2 sampai ${N+1}). Sisanya kosong dan tidak dihitung.`],
    ['Status',`Semua halaman memakai empat status dari dropdown Excel: Completed, In progress, Blocked, Not started. Labelnya sama di seluruh dashboard: Selesai, Berjalan, Terblokir, Belum mulai.`],
    ['SLA',`Excel menampilkan tanggal tahun 1773 di kolom SLA saat tanggal selesai kosong. Di sini SLA hanya dihitung bila tanggal mulai dan selesai ada. Rata-rata ${f1(SLA)} hari dihitung dari ${slaList.length} tugas Selesai. Tugas yang belum selesai memakai umur sejak tanggal mulai.`],
    ['Sheet Project',`Dari ${D.meta.proj_sheet_rows} baris, hanya ${P.length} sub-task yang bernama. ${D.meta.proj_dup} baris sisanya sama persis dengan baris Main Tracker (prioritas, divisi, kategori, status, tanggal), jadi tidak dihitung dua kali.`],
    ['Status dokumen',`Excel menandai semua ${DOC.length} dokumen sebagai Kedaluwarsa. Di sini status dihitung dari End date terhadap ${fd(D.today)}: ${docC.expired||0} kedaluwarsa dan ${docC.noend||0} belum punya tanggal berakhir.`],
    ['Ejaan',`"Makerting" di kolom Instansi disamakan menjadi "Marketing". Judul permintaan tidak diubah.`]
  ];
  $('view').innerHTML=`<section class="panel"><h2>Perlu dibenahi di Excel</h2><p class="sub">Dashboard tidak menebak isi yang kosong atau meragukan.</p>
    ${todo.map(x=>`<div class="issue"><div class="k" style="background:var(--${x[0]}-bg);color:var(--${x[0]==='info'?'info':x[0]})">${x[1]}</div><b>${x[2]}</b><span class="d">${x[3]}<div class="fix"><em>Tindakan:</em> ${x[4]}</div></span></div>`).join('')}</section>
  <section class="panel"><h2>Sudah disamakan di dashboard</h2><p class="sub">Angka di semua halaman berasal dari sheet Main Tracker, Project, dan Document Lists.</p>
    ${done.map(x=>`<div class="issue"><div class="k" style="background:var(--ok-bg);color:var(--ok);font-size:12px;padding:6px 4px">${x[0]}</div><span class="d" style="grid-column:2;color:var(--text)">${x[1]}</span></div>`).join('')}</section>`;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(cur==='ringkasan')go('ringkasan')});
go('ringkasan');
</script>
